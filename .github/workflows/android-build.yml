name: Android Debug APK Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

env:
  JAVA_VERSION: '17'
  GRADLE_OPTS: '-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs="-Xmx2g"'
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  ANDROID_TOOLS: ${{ github.workspace }}/cmdline-tools

jobs:
  assemble:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5

      - name: Install Android SDK tools
        run: |
          mkdir -p ${{ env.ANDROID_HOME }}
          yes | ${{ env.ANDROID_TOOLS }}/bin/sdkmanager --sdk_root=${{ env.ANDROID_HOME }} --update > /dev/null 2>&1 || true
          ${{ env.ANDROID_TOOLS }}/bin/sdkmanager --sdk_root=${{ env.ANDROID_HOME }} --licenses <<< "y" > /dev/null 2>&1 || true
          ${{ env.ANDROID_TOOLS }}/bin/sdkmanager --sdk_root=${{ env.ANDROID_HOME }} --install "platform-tools" "platforms;android-35" "build-tools;35.0.0" "cmdline-tools;latest" > /dev/null 2>&1 || true

      - name: Setup Android environment
        run: |
          echo "ANDROID_HOME=${{ env.ANDROID_HOME }}" >> $GITHUB_ENV
          echo "PATH=${{ env.ANDROID_HOME }}/platform-tools:${{ env.ANDROID_HOME }}/build-tools/35.0.0:$PATH" >> $GITHUB_ENV

      - name: Decode keystore from secrets
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "KEYSTORE_BASE64=${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > /tmp/keystore.jks
            cp /tmp/keystore.jks android/app/src/main/assets/keystore.jks
            echo "KEYSTORE_PATH=/tmp/keystore.jks" >> $GITHUB_ENV
          fi

      - name: Build debug APK
        run: |
          cd android
          ./gradlew clean assembleDebug --no-daemon --console=plain -Pverbose

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: cybertrace-dashboard-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            android/app/build/reports/lint-results-debug.html
            android/app/build/outputs/logs/debug.log
          retention-days: 3
