<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Opening link…</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0b1220;
        color: #93a4bd;
        font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
    </style>
  </head>
  <body>
    <p>Opening link…</p>
    <script>
      // Hosts that serve a real 404 for unknown paths deliver this file, which
      // is how /c/<token> reaches the app. Rewrite to the query form and let
      // the React app take over.
      (function () {
        var p = location.pathname;
        var i = p.indexOf("/c/");
        var base = i >= 0 ? p.slice(0, i + 1) : p.replace(/[^/]*$/, "");
        var token = i >= 0 ? p.slice(i + 3).replace(/\/+$/, "") : "";
        var target =
          base + "index.html" + (token ? "?t=" + encodeURIComponent(decodeURIComponent(token)) : "");
        location.replace(target);
      })();
    </script>
    <noscript><a href="./index.html">Continue to CyberTrace</a></noscript>
  </body>
</html>
